<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地毯周刊 - AI智能内容平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0a0a0a; color: white; font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .text-red { color: #e30614; }
        .bg-red { background-color: #e30614; }
        .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.08); }
        .magazine-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem; }
        .badge-new { animation: pulse-red 2s infinite; }
        @keyframes pulse-red { 0%, 100% { box-shadow: 0 0 0 0 rgba(227, 6, 20, 0.4); } 50% { box-shadow: 0 0 0 8px rgba(227, 6, 20, 0); } }
        .loading { border: 3px solid rgba(255,255,255,0.1); border-left-color: #e30614; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen">

    <!-- 导航 -->
    <nav class="fixed top-0 w-full bg-black/80 backdrop-blur border-b border-white/10 z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-red rounded-lg flex items-center justify-center">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path>
                    </svg>
                </div>
                <span class="font-bold text-lg tracking-wide">地毯周刊</span>
            </div>
            <div class="hidden md:flex gap-8 text-sm text-gray-400">
                <a href="#latest" class="hover:text-white transition">实时新品</a>
                <a href="#magazine" class="hover:text-white transition">本周杂志</a>
                <a href="#manage" class="hover:text-white transition">监控管理</a>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section class="pt-32 pb-20 px-6">
        <div class="max-w-7xl mx-auto text-center">
            <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-red/10 border border-red/20 text-red text-sm mb-6">
                <span class="w-2 h-2 bg-red rounded-full animate-pulse"></span>
                <span id="status-text">连接数据库中...</span>
            </div>
            <h1 class="font-serif text-6xl md:text-8xl font-bold mb-6 leading-none tracking-tight">
                地毯<span class="text-red">周刊</span>
            </h1>
            <p class="text-xl text-gray-400 max-w-2xl mx-auto mb-8">
                实时监控全球顶级地毯品牌，AI智能分类与内容生成
            </p>
            <div class="flex justify-center gap-4">
                <a href="#latest" class="bg-red hover:bg-red-700 px-8 py-3 rounded-xl transition font-medium">查看实时新品</a>
                <button onclick="document.getElementById('add-modal').classList.remove('hidden')" class="border border-white/30 hover:bg-white/10 px-8 py-3 rounded-xl transition">
                    + 添加新品
                </button>
            </div>
        </div>
    </section>

    <!-- 实时新品 -->
    <section id="latest" class="py-20 px-6 border-t border-white/10">
        <div class="max-w-7xl mx-auto">
            <div class="flex justify-between items-end mb-12">
                <div>
                    <span class="text-red text-sm tracking-wider font-medium">NEW ARRIVALS</span>
                    <h2 class="font-serif text-4xl font-bold mt-2">实时新品</h2>
                    <p class="text-gray-400 mt-2">来自数据库的最新数据</p>
                </div>
                <button onclick="loadCarpets()" class="p-2 rounded-lg hover:bg-white/5 border border-white/10 transition" title="刷新">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
            </div>
            
            <div id="loading-indicator" class="flex justify-center py-20">
                <div class="loading"></div>
            </div>
            
            <div id="products-grid" class="magazine-grid hidden">
                <!-- 动态加载 -->
            </div>
        </div>
    </section>

    <!-- 监控源管理 -->
    <section id="manage" class="py-20 px-6 border-t border-white/10">
        <div class="max-w-3xl mx-auto">
            <div class="flex justify-between items-center mb-8">
                <div>
                    <span class="text-red text-sm tracking-wider font-medium">MONITOR</span>
                    <h2 class="font-serif text-4xl font-bold mt-2">监控源管理</h2>
                </div>
                <button onclick="document.getElementById('source-modal').classList.remove('hidden')" class="bg-red hover:bg-red-700 px-4 py-2 rounded-lg text-sm transition">
                    + 添加监控网站
                </button>
            </div>
            
            <div class="glass rounded-2xl p-6">
                <div id="sources-list" class="space-y-3">
                    <div class="text-center text-gray-500 py-8">加载中...</div>
                </div>
            </div>
        </div>
    </section>

    <!-- 添加新品模态框 -->
    <div id="add-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur z-50 flex items-center justify-center p-6">
        <div class="glass rounded-2xl p-8 max-w-md w-full relative max-h-[90vh] overflow-y-auto">
            <button onclick="document.getElementById('add-modal').classList.add('hidden')" class="absolute top-4 right-4 text-gray-500 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <h3 class="font-serif text-2xl mb-6">添加新品地毯</h3>
            <form id="add-carpet-form" class="space-y-4">
                <input type="text" name="name" placeholder="产品名称" required class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 focus:border-red focus:outline-none">
                <input type="text" name="brand" placeholder="品牌" required class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 focus:border-red focus:outline-none">
                <input type="text" name="price" placeholder="价格 (如: ¥25,000)" required class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 focus:border-red focus:outline-none">
                <input type="url" name="image_url" placeholder="图片链接 (https://...)" required class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 focus:border-red focus:outline-none">
                <select name="material" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 focus:border-red focus:outline-none">
                    <option value="">选择材质</option>
                    <option value="羊毛">羊毛</option>
                    <option value="真丝">真丝</option>
                    <option value="棉麻">棉麻</option>
                    <option value="混纺">混纺</option>
                </select>
                <input type="text" name="style" placeholder="风格 (如: 现代/波斯/北欧)" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 focus:border-red focus:outline-none">
                <textarea name="description" placeholder="产品描述" rows="3" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 focus:border-red focus:outline-none"></textarea>
                <button type="submit" class="w-full bg-red hover:bg-red-700 py-3 rounded-lg transition font-medium">提交</button>
            </form>
        </div>
    </div>

    <!-- 添加监控源模态框 -->
    <div id="source-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur z-50 flex items-center justify-center p-6">
        <div class="glass rounded-2xl p-8 max-w-md w-full relative">
            <button onclick="document.getElementById('source-modal').classList.add('hidden')" class="absolute top-4 right-4 text-gray-500 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <h3 class="font-serif text-2xl mb-6">添加监控网站</h3>
            <form id="add-source-form" class="space-y-4">
                <input type="text" name="name" placeholder="网站名称 (如: The Rug Company)" required class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 focus:border-red focus:outline-none">
                <input type="url" name="url" placeholder="网址 (https://...)" required class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 focus:border-red focus:outline-none">
                <button type="submit" class="w-full bg-red hover:bg-red-700 py-3 rounded-lg transition font-medium">添加</button>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        let carpetData = [];

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadCarpets();
            loadSources();
            
            // 表单提交事件
            document.getElementById('add-carpet-form').addEventListener('submit', handleAddCarpet);
            document.getElementById('add-source-form').addEventListener('submit', handleAddSource);
        });

        // 加载地毯数据
        async function loadCarpets() {
            const grid = document.getElementById('products-grid');
            const loading = document.getElementById('loading-indicator');
            const statusText = document.getElementById('status-text');
            
            loading.classList.remove('hidden');
            grid.classList.add('hidden');
            
            try {
                const response = await fetch(`${API_BASE}/carpets`);
                if (!response.ok) throw new Error('API Error');
                
                carpetData = await response.json();
                statusText.textContent = `已连接数据库 · 共 ${carpetData.length} 款新品`;
                
                renderCarpets();
            } catch (error) {
                console.error('加载失败:', error);
                statusText.textContent = '数据库连接失败，使用本地数据';
                // 使用备用数据
                carpetData = [
                    {id: 1, name: '示例地毯', brand: '示例品牌', price: '¥0', image_url: 'https://via.placeholder.com/400x500', material: '羊毛', style: '现代', description: '请配置Supabase数据库'},
                ];
                renderCarpets();
            } finally {
                loading.classList.add('hidden');
                grid.classList.remove('hidden');
            }
        }

        // 渲染地毯
        function renderCarpets() {
            const grid = document.getElementById('products-grid');
            if (carpetData.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center text-gray-500 py-20">暂无数据，请点击"添加新品"</div>';
                return;
            }
            
            grid.innerHTML = carpetData.map(item => `
                <div class="glass rounded-2xl overflow-hidden group">
                    <div class="aspect-[4/5] overflow-hidden relative">
                        <img src="${item.image_url}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" alt="${item.name}" onerror="this.src='https://via.placeholder.com/400x500?text=No+Image'">
                        <div class="absolute top-3 right-3 bg-black/50 backdrop-blur px-2 py-1 rounded text-xs">${item.brand}</div>
                    </div>
                    <div class="p-6">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs text-gray-500">${item.material || '未知材质'}</span>
                            <span class="text-red font-bold">${item.price}</span>
                        </div>
                        <h3 class="font-serif text-xl mb-2">${item.name}</h3>
                        <p class="text-sm text-gray-400 line-clamp-2 mb-3">${item.description || '暂无描述'}</p>
                        <div class="flex gap-2">
                            <span class="px-2 py-1 rounded-full bg-white/5 text-xs text-gray-400">${item.style || '现代'}</span>
                            <span class="px-2 py-1 rounded-full bg-white/5 text-xs text-gray-400">${item.scene || '客厅'}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 添加地毯
        async function handleAddCarpet(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            
            // 处理数组字段
            data.colors = ['默认']; // 简化处理
            
            try {
                const response = await fetch(`${API_BASE}/carpets`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    alert('添加成功！');
                    document.getElementById('add-modal').classList.add('hidden');
                    e.target.reset();
                    loadCarpets(); // 刷新列表
                } else {
                    throw new Error('添加失败');
                }
            } catch (error) {
                alert('错误：' + error.message);
            }
        }

        // 加载监控源
        async function loadSources() {
            const list = document.getElementById('sources-list');
            try {
                const response = await fetch(`${API_BASE}/sources`);
                const sources = await response.json();
                
                if (sources.length === 0) {
                    list.innerHTML = '<div class="text-center text-gray-500 py-8">暂无监控源，请点击右上角添加</div>';
                    return;
                }
                
                list.innerHTML = sources.map(source => `
                    <div class="flex justify-between items-center p-4 bg-white/5 rounded-xl hover:bg-white/10 transition">
                        <div>
                            <p class="font-medium">${source.name}</p>
                            <p class="text-sm text-gray-500">${source.url}</p>
                        </div>
                        <div class="flex items-center gap-4">
                            <span class="flex items-center gap-1 text-green-500 text-sm">
                                <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                                ${source.status}
                            </span>
                            <button onclick="deleteSource(${source.id})" class="p-2 hover:bg-red/10 rounded-lg text-red transition" title="删除">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                list.innerHTML = '<div class="text-center text-red-500 py-8">加载失败，请检查数据库连接</div>';
            }
        }

        // 添加监控源
        async function handleAddSource(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            
            try {
                const response = await fetch(`${API_BASE}/sources`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    alert('添加成功！');
                    document.getElementById('source-modal').classList.add('hidden');
                    e.target.reset();
                    loadSources();
                } else {
                    throw new Error('添加失败');
                }
            } catch (error) {
                alert('错误：' + error.message);
            }
        }

        // 删除监控源
        async function deleteSource(id) {
            if (!confirm('确定要删除这个监控源吗？')) return;
            
            try {
                const response = await fetch(`${API_BASE}/sources?id=${id}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    loadSources();
                } else {
                    throw new Error('删除失败');
                }
            } catch (error) {
                alert('错误：' + error.message);
            }
        }
    </script>
</body>
</html>
